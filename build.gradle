plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.26.0")
    implementation("org.testng:testng:7.11.0")

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation 'ch.qos.logback:logback-classic:1.5.13'

    testImplementation 'io.qameta.allure:allure-testng:2.29.1'



}

test {
    useTestNG()
}

tasks.register('qa', Test) { Test it ->
    useTestNG() {
        listeners.add('io.qameta.allure.testng.AllureTestNg')
        def suite = System.getProperty('suite', '')
        if (suite.equals('quick')) {
            suites 'src/test/resources/quick.xml'
        } else if (suite.equals('login')) {
            suites 'src/test/resources/login.xml'
        } else {
            suites 'src/test/resources/testng.xml'
        }


    }
    if (project.hasProperty('browser')) {
        systemProperty 'browser', "${browser}"
    }

}



    tasks.register('scope', Test){ Test it->
        useTestNG(){
            listeners.add('io.qameta.allure.testng.AllureTestNg')
            suites 'src/test/resources/scope.xml'
        }

        if (project.hasProperty('browser')) {
            systemProperty 'browser', "${browser}"
        }

    }

tasks.register('groups', Test){ Test it->
    useTestNG(){
        listeners.add('io.qameta.allure.testng.AllureTestNg')
        def groups = System.getProperty('groups')
        if (groups != null) {
            includeGroups groups
        }
        suites 'src/test/resources/base.xml'
    }
}

